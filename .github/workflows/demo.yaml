
name: Terraform-Code-Scanning

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =====================================
  # JOB 1: TERRAFORM VALIDATION
  # =====================================

  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate


  # =====================================
  # JOB 2: TFLINT
  # =====================================

  terraform-lint:
    name: Terraform Lint - TFLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive


  # =====================================
  # JOB 3: CHECKOV SECURITY SCAN
  # =====================================

  terraform-security:
    name: Terraform Security - Checkov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov Scan
        run: checkov -d . --framework terraform


  # =====================================
  # JOB 4: TERRASCAN SECURITY SCAN
  # =====================================

  terrascan:
    name: Terraform Security - Terrascan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Terrascan
        uses: tenable/terrascan-action@main
        with:
          iac_type: terraform
          iac_version: v14
          policy_type: aws
          only_warn: false
          sarif_upload: false
